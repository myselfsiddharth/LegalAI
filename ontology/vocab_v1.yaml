claim_fact_templates:
  claim_01:
    name: Title / Ownership / Declaratory Rights
    issue: Does the claimant hold a valid title, ownership interest, leasehold interest, allotment right,
      possessory right, development right, or other legally protected property interest in the subject
      property?
    facts:
    - Claimed property interest exists or is alleged.
    - Chain of title or tenure is documented.
    - Possession or enjoyment is established or disputed.
    - Competing title or adverse claim exists.
    - Property records support, contradict, or fail to reflect the claimed right.
  claim_02:
    name: Possession / Injunction / Dispossession
    issue: Is the claimant entitled to protection or restoration of possession, or restraint against interference,
      eviction, demolition, construction, transfer, or dispossession?
    facts:
    - Claimant is in possession or claims settled possession.
    - Respondent interfered or threatened interference.
    - Notice or due process is present, absent, defective, disputed, or unknown.
    - Possession is lawful, unauthorized, disputed, protected, or unknown.
    - Urgent threat requiring interim protection exists.
  claim_03:
    name: Lease / Tenancy / Allotment Rights
    issue: Did the respondent unlawfully impair, terminate, override, or deny lease, tenancy, sub-lease,
      allotment, occupancy, renewal, NOC, development, or enjoyment rights?
    facts:
    - Tenure document exists or is alleged.
    - Tenure is subsisting, expired, terminated, disputed, renewable, or unknown.
    - Breach or default is alleged by either side.
    - Due process for termination or alteration is disputed.
    - Superior statutory authority is invoked to override tenure rights.
  claim_04:
    name: Redevelopment / Planning / Development Rights
    issue: Is the challenged redevelopment, planning, tender, developer appointment, consent process,
      cluster inclusion, or rehabilitation scheme lawful and binding on affected property holders or occupants?
    facts:
    - Redevelopment scheme exists or is proposed.
    - Scheme is self-redevelopment, authority-led, developer-led, cluster, slum, or integrated redevelopment.
    - Consent requirement is required, waived, disputed, not applicable, or unknown.
    - Public interest or planned development justification is asserted.
    - Rehabilitation/compensation entitlement is provided, disputed, absent, or unknown.
  claim_05:
    name: Government Action / Constitutional Property Deprivation
    issue: Did a State, statutory authority, municipal body, revenue authority, or public agency deprive,
      restrict, dilute, or override property rights without authority of law, due process, equality, or
      fair compensation?
    facts:
    - Public authority action exists or is threatened.
    - Statutory source of power is identified or disputed.
    - Notice and hearing were given, denied, defective, disputed, or unknown.
    - Article 300A / Article 14 / Article 21 / Article 19 issue is raised.
    - Public interest justification is asserted.
  claim_06:
    name: Ultra Vires Executive Action / Statutory Override
    issue: Did the State or public authority exceed executive, delegated, statutory, planning, or regulatory
      power by issuing directions that override binding law, statutory procedure, consent thresholds,
      or vested property rights?
    facts:
    - Parent statute or regulation prescribes procedure.
    - Impugned action alters, waives, bypasses, or overrides that procedure.
    - Action is administrative/executive rather than legislative amendment.
    - Affected party statutory protection is diluted or removed.
    - Similarly situated parties are treated differently.
  claim_07:
    name: Co-operative Society / Associational Autonomy
    issue: Does the challenged action force a society, group, association, or member body into redevelopment,
      amalgamation, cluster treatment, or governance change without required consent, statutory process,
      or associational autonomy protection?
    facts:
    - Claimant is a registered society, association, or member body.
    - Scheme affects collective governance or society identity.
    - Society-level or member-level consent is required, disputed, not required, or unknown.
    - Statutory amalgamation/redevelopment process was followed, bypassed, defective, disputed, or unknown.
    - Members objected, consented, split, were not consulted, or unknown.
  claim_08:
    name: Adverse Possession / Limitation / Long Possession
    issue: Has long, open, continuous, hostile, and exclusive possession matured into a legally enforceable
      right, or is the property claim barred by limitation, delay, or laches?
    facts:
    - Date or period of possession is pleaded.
    - Nature of possession is owner-like, permissive, tenant-like, encroaching, or disputed.
    - True owner title is admitted, denied, disputed, or unknown.
    - Limitation defense or adverse possession claim is raised.
    - Delay, laches, acquiescence, or stale claim is alleged.
  claim_09:
    name: Partition / Joint Family Property
    issue: Is the claimant entitled to a specific share and separate possession of joint family or co-owned
      property?
    facts:
    - Property is ancestral or jointly acquired.
    - Claimant was excluded from enjoyment.
    - Prior partition has not occurred or is disputed.
    - Family branch, share, and possession are pleaded.
  claim_10:
    name: Specific Performance of Agreement to Sell
    issue: Did the respondent fail to execute the sale deed despite a valid agreement and the claimant
      readiness and willingness to perform?
    facts:
    - Agreement executed.
    - Earnest money or consideration paid.
    - Buyer served notice to perform.
    - Seller refused or alienated property to a third party.
    - Delay, hardship, or third-party equities are alleged.
  claim_11:
    name: Cancellation of Deed / Instrument
    issue: Is the registered sale deed, gift deed, will, conveyance, or other instrument void or voidable
      due to fraud, coercion, impersonation, want of authority, or lack of capacity?
    facts:
    - Document was executed by someone without title.
    - Executant was of unsound mind or lacked capacity.
    - Signatures or thumb impressions are alleged forged.
    - Claimant discovered instrument later.
    - Instrument clouds title or possession.
  claim_12:
    name: Mortgage / Redemption / Foreclosure
    issue: Is the mortgagor entitled to redeem the property upon payment, or is the mortgagee entitled
      to foreclose, sell, or enforce security?
    facts:
    - Mortgage deed executed.
    - Principal/interest tendered or defaulted.
    - Limitation period for redemption is active or disputed.
    - Mortgagee remained in possession or collected income.
    - Accounting of dues is disputed.
  claim_13:
    name: Succession / Testamentary / Inheritance
    issue: Who is the rightful legal heir or legatee entitled to mutate, inherit, administer, or possess
      the property?
    facts:
    - 'Personal Law Axis: Hindu Succession Act; Muslim Personal Law/Shariat; Indian Succession Act; Customary
      Law; Other Personal Law.'
    - Will is genuine and last testament, or class of heirs is undisputed.
    - Attesting witnesses are available or disputed.
    - Surviving heirs, branch shares, and exclusion are pleaded.
    - Mutation based on succession is sought or challenged.
  claim_14:
    name: Benami Transactions
    issue: Was the property purchased in the name of a benamidar while consideration flowed from the alleged
      real owner, subject to statutory prohibition or exception?
    facts:
    - Funds routed from claimant or alleged real owner.
    - Property managed or possessed by person other than title holder.
    - Original title deeds held by alleged real owner.
    - Tax, rent, repairs, or benefits paid/received by alleged real owner.
    - HUF, spouse, fiduciary, or statutory exception is invoked.
  claim_15:
    name: Land Acquisition / Expropriation
    issue: Was the acquisition of private land legally valid, and was fair compensation awarded?
    facts:
    - Notification issued.
    - Objections ignored or inadequately heard.
    - Compensation calculated below market value.
    - Physical possession taken or disputed.
    - Public purpose or urgency is asserted.
    - Comparable sale evidence exists or is disputed.
