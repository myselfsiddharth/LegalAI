  5_claim_template_and_mandatory_metadata:
    Issue: Legal question presented.
    Rule & Authority: AuthorityRecord links for statute, case law, regulation, order, GR, or legal standard.
    Elements: Element objects, each with burden metadata, linked facts, evidence, events, and authorities.
    Facts: Structured fact propositions with source span and disputed status.
    Evidence: EvidenceRecord links with status, masking, admissibility, procedural usability, and source
      span.
    Defenses / Rebuttals: Defense theory, respondent argument, claimant rebuttal, authority relied on,
      court treatment.
    Remedy: Requested and granted/denied relief with tier, source span, and validation status.
  5_claim_template_and_mandatory_metadata_2:
    Element.element_id: String identifier.
    name: Element name.
    status: satisfied; contested; missing; defeated; not_applicable; unknown.
    burden_on: claimant; respondent; authority; party_id.
    burden_standard: prima_facie; balance_of_probabilities; statutory_presumption; clear_proof_required;
      beyond_reasonable_doubt_if_penal; unknown.
    burden_shifts_when: Trigger fact or event ID; e.g., registered deed produced, possession shown, authority
      action admitted, will propounded, statutory exception invoked.
    linked_facts: List of fact IDs.
    linked_evidence: List of evidence IDs.
    linked_authorities: List of AuthorityRecord IDs.
  8_evidence_proof_matrix_and_evidence_status:
    evidence_id: String identifier.
    evidence_category: title_tenure; possession_site; planning_redevelopment; administrative_procedural;
      expert; financial; succession; acquisition; forensic; other.
    document_type: 'Specific evidence type: sale deed, 7/12 extract, property card, will, mortgage deed,
      LAO award, map, notice, order, report, testimony, etc.'
    evidence_status: admitted; contested; inadmissible; privileged; masked; missing; disputed_authenticity;
      unknown.
    masking_reason: privacy; privilege; confidentiality; court_order; sensitive_personal_data; minor_or_family_data;
      none.
    admissibility_status: admissible; disputed; privileged; hearsay; stage_limited; requires_foundation;
      unknown.
    procedural_usability: pleading; interim_relief; discovery; trial; appeal; settlement; valuation; execution.
    source_span: paragraph_id, file_span_id, exhibit page, order paragraph, transcript line, or record
      reference.
    supports_or_defeats: supports; defeats; contests; bridges; background.
    linked_claims / elements / events / authorities: Reference lists.
patterns_instantiated:
- 'Title / Ownership Dispute: competing title, defective conveyance, sale deed challenge, mutation dispute,
  inheritance dispute, boundary dispute, fraudulent transfer.'
- 'Possession / Dispossession: eviction, threatened dispossession, demolition, encroachment, trespass,
  adverse possession, illegal occupation, possessory injunction.'
- 'Lease / Tenancy / Allotment: lease term dispute, sub-lease rights, lease termination, rent/premium
  dispute, NOC refusal, allotment cancellation, occupancy right, renewal dispute.'
- 'Redevelopment / Planning: self-redevelopment, cluster redevelopment, public authority redevelopment,
  developer appointment, consent dispute, FSI/TDR dispute, rehabilitation entitlement.'
- 'Constitutional Deprivation: Article 300A deprivation, expropriation without authority of law, illusory
  compensation, forced eviction, loss of development potential.'
- 'Executive Override / Ultra Vires: executive fiat overriding statute, ultra vires government resolution,
  retrospective policy alteration, delegated power excess, statutory safeguard bypass.'
- 'Society / Collective Property: co-operative society rights, member consent, forced amalgamation, cluster
  inclusion, majority-minority conflict, society resolution dispute.'
- 'Revenue / Land Record: mutation entry, 7/12 extract, property card, survey record, demarcation, measurement,
  record-of-rights correction.'
- 'Procedural / Forum: writ petition, civil suit, revenue appeal, co-operative forum, tribunal proceeding,
  alternative remedy, limitation, laches, res judicata.'
- 'Additional High-Volume Modules: partition, specific performance, cancellation, mortgage/redemption,
  succession, benami, land acquisition.'
validation_gates:
- 'Narrative completeness: event sequence must show key steps from transaction/breach to suit/order/appeal
  where available.'
- 'Authority grounding: each rule, case citation, statute, or GR must be represented as an AuthorityRecord
  with cited proposition and temporal validity.'
- 'Element proof: each claim conclusion must map to element, burden, fact, evidence, and authority.'
- 'Evidence status: no evidence may be displayed as proof unless its status and masking/admissibility
  fields are set.'
- 'Burden shift: any shifted burden must reference the triggering fact or event.'
- 'Jurisdiction/forum: authority, forum, and remedy must be valid for the Indian land/property module
  and the specific forum or state context.'
- 'Human review: reusable symbolic patterns and disputed authority mappings require legal-guide approval
  before promotion.'
design_rules:
- 'Jurisdiction-scoped by default: this module is India-specific. Any Pakistan, US, EU, or global variant
  should be a parallel module, not a mixed enum list.'
- Every claim must map Issue -> Rule & Authority -> Elements -> Facts -> Evidence -> Defenses/Rebuttals
  -> Remedies -> Validation.
- Every factual proposition must trace to a source span or an evidence object.
- Every authority must state the proposition for which it is cited and its temporal validity.
- Every element must state who carries the burden and when that burden shifts.
- Every evidence object must have a status and masking/admissibility profile before display or export.
