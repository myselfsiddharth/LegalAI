- claim_id: claim_11
  number: 11
  name: Cancellation of Deed / Instrument
  slug: cancellation_of_deed_instrument
  issue: Is the registered sale deed, gift deed, will, conveyance, or other instrument void or voidable
    due to fraud, coercion, impersonation, want of authority, or lack of capacity?
  notes: 'Default burden_on: claimant. Burden shifts when fiduciary relationship, suspicious circumstances,
    or admitted custody/control is established.'
  elements:
  - element_id: claim_11_e01
    name: Execution of Document
    slug: execution_of_document
    definition: null
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  - element_id: claim_11_e02
    name: Vitiating Factor
    slug: vitiating_factor
    definition: fraud, coercion, impersonation, incapacity, absence of authority, or forgery.
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  - element_id: claim_11_e03
    name: Injury or Cloud on Claimant Right
    slug: injury_or_cloud_on_claimant_right
    definition: null
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  - element_id: claim_11_e04
    name: Limitation and knowledge of instrument
    slug: limitation_and_knowledge_of_instrument
    definition: null
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  facts:
  - Document was executed by someone without title.
  - Executant was of unsound mind or lacked capacity.
  - Signatures or thumb impressions are alleged forged.
  - Claimant discovered instrument later.
  - Instrument clouds title or possession.
  evidence:
  - Registered deeds, gift deeds, wills, powers of attorney, and registration records.
  - Forensic handwriting or fingerprint reports.
  - Medical records of executant.
  - Police complaints and criminal records.
  - Contrasting registered documents and witness testimony.
