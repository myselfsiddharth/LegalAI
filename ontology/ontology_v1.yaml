version: 1
source_document: Land_Property_Dispute_India_Ontology_Refined.docx
jurisdiction: India
domain: land and property disputes
claims:
- claim_id: claim_01
  number: 1
  name: Title / Ownership / Declaratory Rights
  slug: title_ownership_declaratory_rights
  issue: Does the claimant hold a valid title, ownership interest, leasehold interest, allotment right,
    possessory right, development right, or other legally protected property interest in the subject property?
  notes: null
  elements:
  - element_id: claim_01_e01
    name: Right / Interest
    slug: right_interest
    definition: legally recognized property interest.
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  - element_id: claim_01_e02
    name: Source
    slug: source
    definition: valid legal source of right.
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  - element_id: claim_01_e03
    name: Breach / Cloud
    slug: breach_cloud
    definition: competing claim, denial, cancellation, mutation dispute, encumbrance, or adverse action.
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  - element_id: claim_01_e04
    name: Harm
    slug: harm
    definition: loss, impairment, uncertainty, or threatened deprivation.
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  facts:
  - Claimed property interest exists or is alleged.
  - Chain of title or tenure is documented.
  - Possession or enjoyment is established or disputed.
  - Competing title or adverse claim exists.
  - Property records support, contradict, or fail to reflect the claimed right.
  evidence:
  - Sale deeds, conveyances, lease deeds, sub-lease deeds, allotment letters, development agreements.
  - Revenue records, mutation entries, 7/12 extracts, property cards, survey records, city survey records.
  - Possession documents, tax receipts, utility bills, occupation records, society records.
  - Maps, plans, demarcation reports, measurement records, sanctioned layouts.
  - Witness testimony and expert title/survey evidence.
- claim_id: claim_02
  number: 2
  name: Possession / Injunction / Dispossession
  slug: possession_injunction_dispossession
  issue: Is the claimant entitled to protection or restoration of possession, or restraint against interference,
    eviction, demolition, construction, transfer, or dispossession?
  notes: null
  elements:
  - element_id: claim_02_e01
    name: Possessory Right
    slug: possessory_right
    definition: actual, constructive, lawful, settled, or protected possession.
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  - element_id: claim_02_e02
    name: Interference
    slug: interference
    definition: threat, dispossession, demolition, obstruction, encroachment, eviction, construction,
      transfer, or denial of access.
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  - element_id: claim_02_e03
    name: Illegality / Lack of Due Process
    slug: illegality_lack_of_due_process
    definition: absence of notice, authority, hearing, statutory compliance, or lawful procedure.
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  - element_id: claim_02_e04
    name: Harm
    slug: harm
    definition: loss of shelter, possession, access, use, enjoyment, livelihood, or property value.
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  facts:
  - Claimant is in possession or claims settled possession.
  - Respondent interfered or threatened interference.
  - Notice or due process is present, absent, defective, disputed, or unknown.
  - Possession is lawful, unauthorized, disputed, protected, or unknown.
  - Urgent threat requiring interim protection exists.
  evidence:
  - Possession records, photographs, inspection reports, utility bills, tax receipts, society records.
  - Notices, eviction orders, demolition notices, stop-work notices, panchanamas.
  - Police complaints, municipal records, correspondence, access-denial records.
  - Site plans, survey reports, occupation certificates, building records.
  - Fact witness, neighbour, official, and surveyor testimony.
- claim_id: claim_03
  number: 3
  name: Lease / Tenancy / Allotment Rights
  slug: lease_tenancy_allotment_rights
  issue: Did the respondent unlawfully impair, terminate, override, or deny lease, tenancy, sub-lease,
    allotment, occupancy, renewal, NOC, development, or enjoyment rights?
  notes: null
  elements:
  - element_id: claim_03_e01
    name: Tenure Right
    slug: tenure_right
    definition: leasehold, sub-lease, tenancy, license, allotment, or occupancy right.
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  - element_id: claim_03_e02
    name: Obligation
    slug: obligation
    definition: duty under lease, statute, allotment terms, rent law, housing law, or authority regulations.
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  - element_id: claim_03_e03
    name: Breach
    slug: breach
    definition: unlawful termination, non-renewal, refusal of NOC, rent/premium dispute, redevelopment
      override, or denial of enjoyment.
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  - element_id: claim_03_e04
    name: Harm
    slug: harm
    definition: loss of possession, use, renewal, development benefit, rehabilitation entitlement, FSI/TDR
      entitlement, or compensation.
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  facts:
  - Tenure document exists or is alleged.
  - Tenure is subsisting, expired, terminated, disputed, renewable, or unknown.
  - Breach or default is alleged by either side.
  - Due process for termination or alteration is disputed.
  - Superior statutory authority is invoked to override tenure rights.
  evidence:
  - Lease deeds, sub-lease deeds, license agreements, allotment letters, rent receipts, premium payment
    records.
  - Termination notices, renewal requests, NOC applications, breach notices, correspondence.
  - Authority regulations, government orders, board resolutions, society records.
  - Payment records, arrears records, tax and maintenance records.
  - Testimony from lessor, lessee, authority officials, society officers, and occupants.
- claim_id: claim_04
  number: 4
  name: Redevelopment / Planning / Development Rights
  slug: redevelopment_planning_development_rights
  issue: Is the challenged redevelopment, planning, tender, developer appointment, consent process, cluster
    inclusion, or rehabilitation scheme lawful and binding on affected property holders or occupants?
  notes: null
  elements:
  - element_id: claim_04_e01
    name: Authority
    slug: authority
    definition: statutory, contractual, ownership, planning, society, or public-authority power.
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  - element_id: claim_04_e02
    name: Compliance
    slug: compliance
    definition: development regulations, planning law, consent requirements, tender process, rehabilitation
      standards, and due process.
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  - element_id: claim_04_e03
    name: Breach / Illegality
    slug: breach_illegality
    definition: lack of consent, lack of authority, arbitrary inclusion/exclusion, defective tender, non-compliance,
      discrimination, ultra vires action, or unfair terms.
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  - element_id: claim_04_e04
    name: Harm
    slug: harm
    definition: loss of self-redevelopment right, displacement, inadequate rehabilitation, reduced area,
      loss of FSI/TDR, delay, or deprivation.
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  facts:
  - Redevelopment scheme exists or is proposed.
  - Scheme is self-redevelopment, authority-led, developer-led, cluster, slum, or integrated redevelopment.
  - Consent requirement is required, waived, disputed, not applicable, or unknown.
  - Public interest or planned development justification is asserted.
  - Rehabilitation/compensation entitlement is provided, disputed, absent, or unknown.
  evidence:
  - Development control regulations, planning permissions, sanctioned plans, government resolutions, circulars,
    policy directions.
  - Tender documents, developer appointment records, redevelopment agreements, project reports.
  - Consent records, society resolutions, meeting minutes, member ballots, objections, representations.
  - Rehabilitation entitlement statements, area statements, rent/compensation offers, eligibility lists.
  - Technical reports, structural reports, feasibility reports, FSI/TDR calculations, layout plans.
- claim_id: claim_05
  number: 5
  name: Government Action / Constitutional Property Deprivation
  slug: government_action_constitutional_property_deprivation
  issue: Did a State, statutory authority, municipal body, revenue authority, or public agency deprive,
    restrict, dilute, or override property rights without authority of law, due process, equality, or
    fair compensation?
  notes: Keep this as the broad constitutional/public-law deprivation module. Use Claim 15 for acquisition-specific
    notification, possession-taking, and valuation disputes.
  elements:
  - element_id: claim_05_e01
    name: State Action
    slug: state_action
    definition: GR, acquisition, reservation, demolition, redevelopment, cancellation, refusal, mutation
      decision, tender, or regulatory restriction.
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  - element_id: claim_05_e02
    name: Legal Authority
    slug: legal_authority
    definition: statutory power, delegated power, planning power, revenue power, acquisition power, or
      executive policy.
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  - element_id: claim_05_e03
    name: Illegality
    slug: illegality
    definition: ultra vires action, arbitrariness, discrimination, lack of notice, natural justice violation,
      lack of compensation, or absence of authority of law.
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  - element_id: claim_05_e04
    name: Harm
    slug: harm
    definition: deprivation, restriction, loss of use, loss of development potential, displacement, compulsory
      association, or denial of benefit.
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  facts:
  - Public authority action exists or is threatened.
  - Statutory source of power is identified or disputed.
  - Notice and hearing were given, denied, defective, disputed, or unknown.
  - Article 300A / Article 14 / Article 21 / Article 19 issue is raised.
  - Public interest justification is asserted.
  evidence:
  - Government resolutions, notifications, circulars, acquisition notices, planning directions, authority
    orders.
  - Objections, representations, hearing records, speaking orders, minutes, file notings.
  - Ownership, possession, lease, revenue, and development records.
  - Comparative treatment evidence and similarly situated property records.
  - Expert, official, planning, valuation, and constitutional-law evidence.
- claim_id: claim_06
  number: 6
  name: Ultra Vires Executive Action / Statutory Override
  slug: ultra_vires_executive_action_statutory_override
  issue: Did the State or public authority exceed executive, delegated, statutory, planning, or regulatory
    power by issuing directions that override binding law, statutory procedure, consent thresholds, or
    vested property rights?
  notes: null
  elements:
  - element_id: claim_06_e01
    name: Power Source
    slug: power_source
    definition: Parent Act, delegated regulation, executive power, planning regulation, government policy,
      or authority circular.
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  - element_id: claim_06_e02
    name: Legal Limit
    slug: legal_limit
    definition: statutory procedure, consent requirement, hearing requirement, compensation requirement,
      regulatory hierarchy, or constitutional safeguard.
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  - element_id: claim_06_e03
    name: Breach
    slug: breach
    definition: executive instruction, GR, tender condition, policy direction, or order conflicts with
      statute or exceeds delegated power.
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  - element_id: claim_06_e04
    name: Harm
    slug: harm
    definition: loss of statutory protection, forced inclusion, arbitrary exclusion, reduced entitlement,
      procedural bypass, or unlawful burden.
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  facts:
  - Parent statute or regulation prescribes procedure.
  - Impugned action alters, waives, bypasses, or overrides that procedure.
  - Action is administrative/executive rather than legislative amendment.
  - Affected party statutory protection is diluted or removed.
  - Similarly situated parties are treated differently.
  evidence:
  - Parent statute, delegated regulations, development control regulations, co-operative law provisions.
  - Government resolutions, circulars, executive directions, policy notes, tender terms.
  - Authority minutes, file notings, comparative treatment records, inclusion/exclusion lists.
  - Objections, representations, legal opinions, and prior court orders.
  - Judicial precedents on statutory hierarchy, delegated legislation, and executive limits.
- claim_id: claim_07
  number: 7
  name: Co-operative Society / Associational Autonomy
  slug: co_operative_society_associational_autonomy
  issue: Does the challenged action force a society, group, association, or member body into redevelopment,
    amalgamation, cluster treatment, or governance change without required consent, statutory process,
    or associational autonomy protection?
  notes: null
  elements:
  - element_id: claim_07_e01
    name: Associational Right
    slug: associational_right
    definition: society identity, member governance, consent right, general body control, or statutory
      autonomy.
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  - element_id: claim_07_e02
    name: Procedure
    slug: procedure
    definition: required resolution, majority threshold, notice, general body process, registrar approval,
      or statutory amalgamation process.
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  - element_id: claim_07_e03
    name: Breach
    slug: breach
    definition: forced amalgamation, cluster inclusion, consent bypass, voting dilution, committee overreach,
      or denial of participation.
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  - element_id: claim_07_e04
    name: Harm
    slug: harm
    definition: loss of self-governance, forced association, voting dilution, loss of redevelopment choice,
      or member-right impairment.
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  facts:
  - Claimant is a registered society, association, or member body.
  - Scheme affects collective governance or society identity.
  - Society-level or member-level consent is required, disputed, not required, or unknown.
  - Statutory amalgamation/redevelopment process was followed, bypassed, defective, disputed, or unknown.
  - Members objected, consented, split, were not consulted, or unknown.
  evidence:
  - Co-operative society registration records, bye-laws, general body minutes, managing committee records.
  - Consent forms, member ballots, redevelopment resolutions, registrar records.
  - Cluster scheme documents, tender conditions, amalgamation proposals, authority directions.
  - Member objections, representations, correspondence, and meeting notices.
  - Testimony from society officers, members, registrar officials, and redevelopment consultants.
- claim_id: claim_08
  number: 8
  name: Adverse Possession / Limitation / Long Possession
  slug: adverse_possession_limitation_long_possession
  issue: Has long, open, continuous, hostile, and exclusive possession matured into a legally enforceable
    right, or is the property claim barred by limitation, delay, or laches?
  notes: null
  elements:
  - element_id: claim_08_e01
    name: Possession
    slug: possession
    definition: actual, open, continuous, exclusive, and identifiable possession.
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  - element_id: claim_08_e02
    name: Hostility / Adverseness
    slug: hostility_adverseness
    definition: possession adverse to true owner, not permissive or derivative.
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  - element_id: claim_08_e03
    name: Continuity / Limitation Period
    slug: continuity_limitation_period
    definition: statutory period satisfied or disputed.
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  - element_id: claim_08_e04
    name: Knowledge / Ouster
    slug: knowledge_ouster
    definition: owner knew or should have known of adverse claim.
    burden_on: null
    burden_standard: null
    burden_shifts_when: null
  facts:
  - Date or period of possession is pleaded.
  - Nature of possession is owner-like, permissive, tenant-like, encroaching, or disputed.
  - True owner title is admitted, denied, disputed, or unknown.
  - Limitation defense or adverse possession claim is raised.
  - Delay, laches, acquiescence, or stale claim is alleged.
  evidence:
  - Revenue records, tax receipts, electricity/water bills, possession certificates, panchanamas.
  - Maps, survey records, photographs, crop records, cultivation records, construction records.
  - Notices, objections, prior suits, complaints, police records, authority correspondence.
  - Witness testimony on possession, use, exclusion, and knowledge.
  - Limitation pleadings and prior litigation records.
