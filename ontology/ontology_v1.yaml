defenses:
- category: Title / Tenure Defense
  slug: title_tenure_defense
  detail: 'No Title; Defective Title; Expired Lease; Breach of Lease; No Conveyance; No Mutation; Permissive
    Possession; Unauthorized Occupation. Rebuttal: chain of title, possession proof, payment proof, authority
    recognition, estoppel, legitimate expectation, long enjoyment, statutory protection.'
- category: Public Interest / Planning Policy Defense
  slug: public_interest_planning_policy_defense
  detail: 'Larger Public Interest; Urban Renewal; Housing Stock Increase; Infrastructure Upgrade; Sustainable
    Town Planning; Safety; Executive Policy Discretion. Rebuttal: proportionality, statutory backing,
    arbitrariness, discrimination, due process, compensation adequacy, actual need.'
- category: Statutory / Regulatory Subservience Defense
  slug: statutory_regulatory_subservience_defense
  detail: 'Lessee rights subservient to superior lessor; special statute override; authority-owned land;
    statutory power to redevelop; compliance with parent Act. Rebuttal: delegated power excess, conflict
    with parent Act, vested rights, lease protection, process failure, Article 300A.'
- category: Consent / Compliance Defense
  slug: consent_compliance_defense
  detail: 'Consent not required; majority consent; statutory waiver; authority ownership; regulation,
    tender, or rehabilitation compliance. Rebuttal: consent required, defective consent, wrong regulation,
    improper classification, non-compliance, inadequate rehabilitation, forced association.'
- category: Procedural / Forum Defense
  slug: procedural_forum_defense
  detail: 'Alternative Remedy; Delay; Laches; Limitation; Res Judicata; Maintainability; Jurisdiction;
    Non-Joinder; Prematurity; Tribunal first instance. Rebuttal: constitutional issue, natural justice
    violation, ultra vires action, lack of efficacious remedy, urgent harm, continuing cause, pure question
    of law.'
- category: Equitable Defense
  slug: equitable_defense
  detail: 'Acquiescence; Waiver; Estoppel; Unclean Hands; Suppression of Facts; Unauthorized Construction;
    Illegal Occupation; Encroachment. Rebuttal: no knowing waiver, authority delay, bona fide possession,
    regularization, public records support, proportionality, clean hands.'
remedy_tiers:
- tier: 'Tier 1: Status Quo and Protection'
  remedies: Status quo order, anti-dispossession injunction, demolition stay, eviction stay, construction
    stay, tender stay, transfer restraint, records preservation order, protection of settled possession,
    restoration of possession, police protection, access restoration, transit protection, stay of GR/tender/developer
    appointment/cluster inclusion.
- tier: 'Tier 2: Declaration and Administrative Correction'
  remedies: Declaration of title, leasehold right, possession, invalid order, development right, Article
    300A violation, mutation correction, property card correction, survey correction, revenue entry correction,
    boundary demarcation, fresh hearing, speaking order, reconsideration, notice compliance, remand to
    authority.
- tier: 'Tier 3: Development / Rehabilitation / Compensation'
  remedies: Consent enforcement, self-redevelopment permission, scheme modification, developer restraint,
    tender quashing, regulatory compliance, alternate accommodation, transit rent, permanent rehousing,
    eligibility recognition, area entitlement, corpus/hardship compensation, acquisition compensation,
    rent compensation, development benefit, FSI/TDR benefit, damages for loss of use, market value compensation.
- tier: 'Tier 4: Final Structural Resolution'
  remedies: Possession decree, eviction, specific performance, cancellation or rectification of instrument,
    quashing of GR/notification/order, mandamus to authority, ultra vires declaration, Article 300A relief,
    Article 14 relief, restitution, mesne profits, accounting, regularization, legitimate expectation
    relief, settlement terms, costs and sanctions.
evidence_groups:
- group: Title / Tenure Evidence
  slug: title_tenure_evidence
  types: Sale deed, conveyance, gift, partition, will, succession records, lease deed, sub-lease, license,
    allotment letter, mortgage deed, renewal records, mutation entries, 7/12 extracts, property cards,
    record of rights, encumbrance certificates, Index-II, search reports.
- group: Possession / Site Evidence
  slug: possession_site_evidence
  types: Possession receipts, tax receipts, utility bills, maintenance records, survey maps, demarcation
    reports, measurement sheets, site plans, photographs, inspection reports, panchanamas, occupancy records,
    witness statements.
- group: Planning / Redevelopment Evidence
  slug: planning_redevelopment_evidence
  types: Development regulations, sanctioned plans, layout plans, building permissions, GRs, notifications,
    circulars, policy directions, tender documents, developer agreements, project reports, consent records,
    rehabilitation statements.
- group: Administrative / Procedural Evidence
  slug: administrative_procedural_evidence
  types: Notices, orders, hearing records, representations, speaking orders, tribunal proceedings, revenue
    appeals, prior suits, writ records, alternative remedy records, limitation records, prior adjudications.
- group: Expert Evidence
  slug: expert_evidence
  types: Title search report, surveyor/architect/planner report, valuation report, structural/safety report,
    rehabilitation/compensation assessment, forensic handwriting/fingerprint report.
schemas:
  1_procedural_history_and_events:
    ProceduralHistory: Container for the chronological and causal sequence of case events.
    Event.event_id: String identifier.
    Event.subtype: Transaction Breach; Agreement Executed; Mutation Applied; Mutation Rejected; Dispossession;
      Possession Taken; Demolition Threatened; Notice Issued; Notice Served; Authority Order Issued; Suit
      Filed; Writ Filed; Interim Order Granted; Interim Order Refused; Decree Passed; Appeal Filed; Appeal
      Decided; Remand Ordered; Settlement Attempt; Dispute Arisen.
    Event.date_or_timestamp: Date, approximate date, or range.
    Event.actor: Reference to Party, Authority, Court, Tribunal, Developer, Society, or Third Party.
    Event.object: Reference to SubjectProperty, Claim, Evidence, AuthorityRecord, or Remedy.
    Event.precedes: Reference to earlier/later Event objects for timeline reconstruction.
    Event.causes: Reference to Event objects causally triggered by this event.
    Event.source_span: Paragraph, pleading, order, exhibit, or record span supporting the event.
    Event.disputed_status: Admitted; Contested; Unclear; Inferred; Human Reviewed.
  2_authority_records_and_case_law_connectivity:
    AuthorityRecord.authority_id: String identifier.
    authority_type: statute; case_law; regulation; government_resolution; circular; court_order; tribunal_order;
      revenue_record; constitutional_provision; contract; custom_or_personal_law.
    citation_or_title: Citation, case title, statute section, GR/circular number, order number, or instrument
      title.
    court_or_forum: Supreme Court of India; High Court; District Court; Civil Court; Revenue Authority;
      Revenue Tribunal; Co-operative Forum; Municipal Authority; Planning Authority; Arbitral Forum; Other.
    holding_or_rule: Short statement of the rule, holding, or legal standard.
    cited_proposition: The proposition for which the authority is cited. This is mandatory.
    linked_claims: Reference list to Claim objects.
    linked_elements: Reference list to Element objects.
    temporal_validity: good_law; overruled; distinguished; pending_appeal; statute_superseded; amended;
      conflicting_authority; unknown.
    jurisdiction_scope: India; State-specific if applicable; forum-specific if applicable.
    source_span: Case paragraph, statute section, exhibit, order page, or citation span.
  3_parties_subject_property_and_relationships:
    Identity: String.
    Proceeding Posture: Petitioner; Plaintiff; Appellant; Applicant; Claimant; Writ Petitioner; Intervenor;
      Objector.
    Property Role: Owner; Co-owner; Lessee; Sub-Lessee; Licensee; Tenant; Occupant; Allottee; Society;
      Society Member; Developer; Purchaser; Heir; Possessor; Mortgagor; Mortgagee; Beneficiary; Benamidar;
      Real Owner; Acquiring Authority Challenger.
    Claimed Right: Title; Possession; Leasehold Right; Sub-Lease Right; Tenancy Right; Development Right;
      Redevelopment Right; FSI/TDR Right; Rehabilitation Right; Compensation Right; Consent Right; Statutory
      Protection; Inheritance Right; Redemption Right; Specific Performance Right.
    Possession Status: In Possession; Dispossessed; Threatened Dispossession; Transit Occupant; Constructive
      Possession; Disputed Possession; Unknown.
  3_parties_subject_property_and_relationships_2:
    Identity: String.
    Proceeding Posture: Respondent; Defendant; Appellant; Public Authority; Planning Authority; Development
      Authority; Revenue Authority; Municipal Authority; Society; Developer; Private Party; Acquiring
      Body.
    Property Role: State; Statutory Authority; Municipal Corporation; Planning Authority; Superior Lessor;
      Landlord; Owner; Acquiring Body; Developer; Society; Adverse Claimant; Encroacher; Transferee; Mortgagee;
      Benamidar; Purchaser Pendente Lite.
    Authority / Control Position: Absolute Owner; Superior Lessor; Planning Controller; Executive Authority;
